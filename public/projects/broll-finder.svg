<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="560" height="300" viewBox="0 0 560 300">
<title>B-Roll Finder — vignette éditable</title>
<desc>Vignette Eulst éditable. Fond et éléments vectoriels séparés. Guides masqués à l’export. Les badges et légendes de la page sont ajoutés par le site.</desc>
