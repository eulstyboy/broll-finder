<rect id="couleur-fond" width="560" height="300" fill="#eeeee7"/>
</g>
<g id="cadre" inkscape:groupmode="layer" inkscape:label="02 — Cadre et axes">
<g fill="none" stroke="#252620" stroke-opacity="0.15"><path d="M0 150h560M280 0v300" stroke-dasharray="3 7"/><rect x="44" y="47" width="472" height="206" rx="2"/></g>
</g>
<g id="plan" inkscape:groupmode="layer" inkscape:label="03 — Plan / paysage">
<rect x="77" y="87" width="114" height="126" rx="3" fill="#dddcd5"/><path d="m77 184 43-47 25 26 20-17 26 38v29H77Z" fill="#b8b9ad"/><circle cx="154" cy="117" r="10" fill="#f6f5f1"/>
</g>
<g id="sequence" inkscape:groupmode="layer" inkscape:label="04 — Séquence / lecture">
<rect x="207" y="87" width="146" height="126" rx="3" fill="#22231f"/><path d="m269 132 29 18-29 18Z" fill="#f6f5f1"/>
</g>
<g id="rythme" inkscape:groupmode="layer" inkscape:label="05 — Rythme / son">
