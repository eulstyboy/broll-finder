<g fill="#252620" fill-opacity="0.5" font-family="Courier New, monospace" font-size="9"><text x="77" y="73">01 — PLAN</text><text x="207" y="73">02 — SÉQUENCE</text><text x="369" y="73">03 — RYTHME</text></g>
</g>
<g id="timeline" inkscape:groupmode="layer" inkscape:label="07 — Ligne de montage">
